- name: tab like a shell completes the shared part
  config: { tabBehavior: "shell" }
  steps:
    - type: "git sta"
    - key: TAB
      expect_line_starts: "git sta"

- name: the list only on Tab
  config: { showListOn: "tab" }
  steps:
    - type: "git sta"
      expect_list: false
    - key: TAB
      expect_list: true

- name: the light theme draws the same list
  config: { theme: "light" }
  steps:
    - type: "git sta"
      list_has: "status"

- name: an invalid setting falls back to the defaults
  config: { maxSuggestions: "lots" }
  steps:
    - type: "git sta"
      list_has: "status"

- name: Enter takes the entry and runs the line when enterRuns is on
  config: { enterRuns: true }
  steps:
    - type: "git stat"
    - key: ENTER
      expect_ran: "git status"

- name: with enterRuns a folder is still walked into
  config: { enterRuns: true }
  steps:
    - type: "cd sr"
    - key: ENTER
      expect_line: "cd src/"
      expect_ran_count: 0
