- name: cd lists only folders
  steps:
    - type: "cd "
      list_has: ["docs{sep}", "src{sep}"]
      list_not: ["README.md", "package.json"]

- name: Enter on a folder walks into it and keeps the list open
  steps:
    - type: "cd sr"
    - key: ENTER
      expect_regex: "qa\\$ cd src[/\\\\]\\s*$"
      list_has: "components{sep}"
      expect_ran_count: 0

- name: the run entry runs cd where you are
  min_cols: 60
  steps:
    - type: "cd sr"
    - key: ENTER
    - key: ENTER
      expect_ran: "cd src{sep}"
    # PowerShell cuts a long path to the window (the temp folders of macOS and Windows are long), and cmd has no pwd
    - type: "pwd<ENTER>"
      skip_shells: [pwsh, powershell, cmd]
      expect: "/Dev/shop/src"

- name: a folder with a space is escaped on the line
  steps:
    - type: "cd fol"
    - key: TAB
      expect_regex: "cd (folder\\\\ with\\\\ space/|'folder with space[/\\\\]'|\"folder with space[/\\\\]\")"

- name: a folder with a space works after Enter
  shells: [zsh, bash, fish]
  steps:
    - type: "cd fol"
    - key: TAB
    - key: C-E
    - key: ENTER
      wait: 300
    - type: "pwd<ENTER>"
      expect: "folder with space"

- name: a folder with Polish letters
  steps:
    - type: "cd za"
    - key: TAB
      expect_regex: "cd zażółć[/\\\\]"

- name: files are offered for cat with their names
  shells: [zsh, bash, fish]
  steps:
    - type: "cat REA"
      list_has: "README.md"
    - key: TAB
      expect_line_starts: "cat README.md"

- name: a path in a subfolder
  steps:
    - type: "ls src/"
      list_has: ["components{sep}", "index.ts"]

- name: parent folder
  steps:
    - type: "ls ../"
      list_has: "shop{sep}"

- name: home with a tilde
  shells: [zsh, bash, fish]
  steps:
    - type: "ls ~/"
      list_has: "Dev/"

- name: hidden files after a dot
  steps:
    - type: "ls ."
      list_has: ".git{sep}"

- name: an absolute path
  shells: [zsh, bash, fish]
  steps:
    - type: "ls /us"
      list_has: "usr/"

# reported by a user: Enter on an absolute path ran cd instead of taking the folder (only Tab worked)
- name: Enter on an absolute path takes the folder
  shells: [zsh, bash, fish]
  steps:
    - type: "cd /us"
    - key: ENTER
      expect_regex: "qa\\$ cd /usr/\\s*$"
      expect_ran_count: 0

- name: Enter deeper in an absolute path takes the folder
  shells: [zsh, bash, fish]
  steps:
    - type: "cd /usr/sh"
    - key: ENTER
      expect_regex: "qa\\$ cd /usr/share/\\s*$"
      expect_ran_count: 0

- name: a bookmarked folder is offered by cd from anywhere
  shells: [zsh, bash, fish]
  steps:
    - type: "thint bookmark add {proj}/docs<ENTER>"
      wait: 1000
    - type: "cd /<ENTER>"
      wait: 300
    - type: "cd doc"
      wait: 300
      list_has: "docs"
