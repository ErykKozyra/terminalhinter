- name: a PATH change made at the prompt reaches the lists
  # the fake kubectl is a sh script, and Windows keeps its own PATH for the commands (Git Bash reports /c/... paths)
  skip_shells: [cmd, nu, xonsh, win:powershell, win:pwsh, win:bash, win:zsh, win:fish]
  files:
    qa-bin/kubectl: |
      #!/bin/sh
      case "$*" in
        *"get pods"*) printf '\nshell-env-pod\n' ;;
        *"api-resources"*) printf 'pods\n' ;;
      esac
  steps:
    - type: "export PATH=\"$PWD/qa-bin:$PATH\"<ENTER>"
      only_shells: [zsh, bash]
      wait: 800
    - type: "set -gx PATH $PWD/qa-bin $PATH<ENTER>"
      only_shells: [fish]
      wait: 800
    - type: "$env:PATH = \"$PWD/qa-bin\" + [IO.Path]::PathSeparator + $env:PATH<ENTER>"
      only_shells: [pwsh]
      wait: 800
    - type: "kubectl get pods "
      wait: 2000
      timeout: 8000
      list_has: "shell-env-pod"

- name: a variable exported at the prompt reaches the lists
  # in PowerShell $NAME is a shell variable, not the environment
  skip_shells: [cmd, nu, xonsh, powershell, pwsh]
  steps:
    - type: "export THINT_QA_PROBE=hello<ENTER>"
      only_shells: [zsh, bash]
      wait: 800
    - type: "set -gx THINT_QA_PROBE hello<ENTER>"
      only_shells: [fish]
      wait: 800
    - type: "echo $THINT_QA_PR"
      wait: 1000
      list_has: "$THINT_QA_PROBE"

- name: the environment report stays out of the screen
  skip_shells: [cmd, nu, xonsh]
  steps:
    - type: "true<ENTER>"
      wait: 800
      expect_not: "PATH="
