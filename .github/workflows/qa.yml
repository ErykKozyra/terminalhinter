name: QA
# The full test run before a release: unit tests, the live scenarios in every shell of each system, and the
# heavier sweeps. It runs on a push to a qa/ branch or by hand, never on main. The results go to the qa-reports
# branch so they can be read without signing in.
on:
  push:
    branches: ["qa/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.21.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1

      - name: Shells on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y zsh fish tmux screen
          sudo chmod -R 755 /usr/share/zsh && sudo chown -R root:root /usr/share/zsh

      - name: Shells on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install fish bash
          for dir in /opt/homebrew/share/zsh /opt/homebrew/share/zsh/site-functions /opt/homebrew/share/fish /opt/homebrew/share/fish/vendor_completions.d; do
            [ -d "$dir" ] && sudo chmod g-w "$dir" || true
          done

      - name: Versions
        shell: bash
        run: |
          mkdir -p qa-out
          {
            echo "os: ${{ matrix.os }}"
            node --version
            for s in zsh bash fish pwsh powershell tmux screen; do
              if command -v $s >/dev/null 2>&1; then
                case $s in
                  pwsh|powershell) echo "$s: $($s -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')" ;;
                  tmux) echo "$s: $(tmux -V)" ;;
                  screen) echo "$s: $(screen -v | head -1)" ;;
                  *) echo "$s: $($s --version | head -1)" ;;
                esac
              fi
            done
          } | tee qa-out/versions-${{ matrix.os }}.txt

      - run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test -- --json --outputFile=qa-out/unit-${{ matrix.os }}.json
        continue-on-error: true

      - run: npm run build

      - name: Live scenarios
        run: node scripts/qa/live/run.mjs --jobs 3 --out qa-out/live-${{ matrix.os }}.json
        continue-on-error: true
        env:
          QA_SLOW: "1.5"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.os }}
          path: qa-out/
          if-no-files-found: warn

  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - name: zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh
      - run: npm ci
      - run: npm run build && npm run package
      - name: Speed and a 20 minute run
        shell: bash
        run: |
          mkdir -p qa-out
          bin=$(ls pkg/terminalhinter-* | grep -v '\.' | head -1)
          THINT_BIN="$bin" QA_SOAK_MINUTES=20 QA_OUT=qa-out/perf-${{ matrix.os }}.json npx tsx scripts/qa/perf.ts
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-perf-${{ matrix.os }}
          path: qa-out/
          if-no-files-found: warn

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1
      - name: zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh
      - name: Package managers
        run: |
          npm i -g pnpm@9 yarn@1 bun@1
          npm i --prefix "$RUNNER_TEMP/v" verdaccio@6
      - run: npm ci
      - run: npm run build && npm run package && npm run package:base
      - name: Install, update and uninstall
        shell: bash
        run: |
          mkdir -p qa-out
          QA_VERDACCIO="$RUNNER_TEMP/v/node_modules/.bin/verdaccio" QA_OUT=qa-out/install-${{ matrix.os }}.json npx tsx scripts/qa/install.ts
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-install-${{ matrix.os }}
          path: qa-out/
          if-no-files-found: warn

  report:
    needs: [test, perf, install]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: qa-*
          merge-multiple: true

      - name: Put the results on the qa-reports branch
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git clone --quiet --depth 1 --branch qa-reports "$remote" reports; then :; else
            mkdir reports && cd reports && git init -q -b qa-reports && git remote add origin "$remote" && cd ..
          fi
          dest="reports/runs/${{ github.run_number }}-${GITHUB_SHA::7}"
          mkdir -p "$dest"
          cp -r results/. "$dest/"
          echo "${{ github.run_number }}-${GITHUB_SHA::7}" > reports/latest.txt
          cd reports
          git add -A
          git -c user.name="Eryk Kozyra" -c user.email=erykkozyra1@gmail.com commit -q -m "QA run ${{ github.run_number }} for ${GITHUB_SHA::7}"
          for i in 1 2 3; do git push -q origin qa-reports && break; git pull -q --rebase origin qa-reports || true; done
